name: Validate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-test:
    name: Build, formatting, dependency convergence, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Compile all modules and run tests
        run: xvfb-run --auto-servernum ./mvnw --batch-mode --no-transfer-progress clean verify

  secret-scan:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  windows-installer:
    name: Build and exercise Windows installer
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes --no-progress
          }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue) -or
              -not (Get-Command light.exe -ErrorAction SilentlyContinue)) {
            throw 'WiX Toolset executables are not available in PATH.'
          }

      - name: Build, install, upgrade, and uninstall package offline
        shell: pwsh
        run: .\scripts\test-windows-installer.ps1
