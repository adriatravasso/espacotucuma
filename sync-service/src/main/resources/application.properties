spring.application.name=espacotucuma-sync-service
server.port=${SERVER_PORT:8080}
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
spring.datasource.url=${SYNC_DATABASE_URL:jdbc:postgresql://localhost:5432/espacotucuma_sync}
spring.datasource.username=${SYNC_DATABASE_USERNAME:espacotucuma}
spring.datasource.password=${SYNC_DATABASE_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.health.db.enabled=true
tucuma.security.sync-secret=${TUCUMA_SYNC_SECRET:}
tucuma.security.requests-per-minute=${TUCUMA_SYNC_REQUESTS_PER_MINUTE:120}
tucuma.backup.storage.bucket=${TUCUMA_BACKUP_BUCKET:}
tucuma.backup.storage.region=${TUCUMA_BACKUP_REGION:us-east-1}
tucuma.backup.storage.endpoint=${TUCUMA_BACKUP_ENDPOINT:}
tucuma.backup.maintenance-cron=${TUCUMA_BACKUP_MAINTENANCE_CRON:0 0 2 * * *}
tucuma.backup.retention.recent-count=${TUCUMA_BACKUP_RETENTION_RECENT_COUNT:30}
tucuma.backup.retention.coverage-days=${TUCUMA_BACKUP_RETENTION_COVERAGE_DAYS:90}
